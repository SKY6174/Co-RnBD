name: Pull request quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-quality-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    name: PR quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - id: scope
        run: node .github/scripts/build-scope.mjs github
      - name: Verify conservative build selection
        run: node --test .github/scripts/build-scope.test.mjs
      - name: Read pinned Supabase CLI version
        if: steps.scope.outputs.app == 'true'
        id: supabase-version
        run: echo "version=$(cat .supabase-cli-version)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.scope.outputs.app == 'true'
        with:
          version: ${{ steps.supabase-version.outputs.version }}
      - name: Check Supabase CLI compatibility (offline)
        if: steps.scope.outputs.app == 'true'
        run: python3 scripts/verify-supabase-cli.py
      - run: npm ci --include=dev --include=optional --prefer-offline --no-audit
        if: steps.scope.outputs.app == 'true'
        working-directory: site
      - run: npm audit --omit=dev --audit-level=high
        if: steps.scope.outputs.app == 'true'
        working-directory: site
      - run: npm run typecheck
        if: steps.scope.outputs.app == 'true'
        working-directory: site
      - run: npm run build
        if: steps.scope.outputs.app == 'true'
        working-directory: site
